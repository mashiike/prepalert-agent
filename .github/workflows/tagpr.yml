name: tagpr and release
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag"
        required: false
        type: string

permissions:
  pull-requests: write
  issues: write
  contents: write
  actions: write
  packages: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      is_release: ${{ steps.tagpr.outputs.tag != '' || (github.event_name == 'workflow_dispatch' && inputs.tag != '') }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
          ref: ${{ inputs.tag || github.ref }}
      - id: tagpr
        uses: Songmu/tagpr@e84001bd5dac8defa0c75b3913937d284a3b3660 # v1
        if: ${{ github.event_name != 'workflow_dispatch' }}

  release:
    needs: tagpr
    if: ${{ needs.tagpr.outputs.is_release == 'true' }}
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: prepalert-agent_linux_amd64
          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: prepalert-agent_linux_arm64
          - target: bun-darwin-x64
            os: ubuntu-latest
            artifact: prepalert-agent_darwin_amd64
          - target: bun-darwin-arm64
            os: ubuntu-latest
            artifact: prepalert-agent_darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate third-party licenses
        run: bun run scripts/generate-licenses.ts
      - name: Embed assets
        run: bun run scripts/embed-assets.ts
      - name: Build binary
        run: |
          bun build --compile --minify --target=${{ matrix.target }} src/index.ts --outfile prepalert-agent
      - name: Create archive
        run: |
          tar czf ${{ matrix.artifact }}.tar.gz prepalert-agent LICENSE RELINKING.md THIRD_PARTY_LICENSES.md
      - name: Upload to release
        run: |
          TAG="${{ inputs.tag || needs.tagpr.outputs.tag }}"
          gh release upload "${TAG}" ${{ matrix.artifact }}.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: tagpr
    if: ${{ needs.tagpr.outputs.is_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || needs.tagpr.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || needs.tagpr.outputs.tag }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checksum:
    needs: [tagpr, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download all assets and create checksums
        run: |
          TAG="${{ inputs.tag || needs.tagpr.outputs.tag }}"
          gh release download "${TAG}" --dir assets
          cd assets && sha256sum *.tar.gz > checksums.txt
          gh release upload "${TAG}" checksums.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
